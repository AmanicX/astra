<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; }
      body {
        background: #12100e;
        color: #f2ede3;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: 72px 80px;
        overflow: hidden;
      }
      .top { display: flex; align-items: center; gap: 16px; }
      .top svg { width: 44px; height: 44px; color: #d9482b; }
      .top span { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
      h1 {
        align-self: center;
        font-size: 84px;
        font-weight: 600;
        letter-spacing: -0.035em;
        line-height: 1.02;
        max-width: 15ch;
      }
      .bot { display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
      .bot p { color: #a79e8d; font-size: 27px; line-height: 1.35; max-width: 34ch; }
      .bot em {
        font-style: normal;
        color: #f26a4c;
        font-size: 22px;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="top">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 2c.5 4.7 1.6 6.9 3.1 8.4S18.6 12 21 12c-4.2.6-6.3 1.4-7.7 2.8S11.4 18.4 12 22c-.6-4.2-1.4-6.3-2.8-7.7S5.4 12.6 2 12c4.2-.6 5.9-1.3 7.2-2.6S11.4 6 12 2Z"
          fill="currentColor" />
      </svg>
      <span>Astra</span>
    </div>
    <h1>Your computer. Your assistant.</h1>
    <div class="bot">
      <p>A local-first AI desktop assistant for Windows and Linux, with a native permission engine.</p>
      <em>amanicx.github.io/astra</em>
    </div>
  </body>
</html>
