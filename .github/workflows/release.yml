name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-22.04
          - windows-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxrandr-dev \
            libgbm-dev \
            rpm \
            libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - run: npm ci

      - name: Build and publish pre-release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Astra ${{ github.ref_name }}"
          releaseBody: |
            Pre-release testing build. Download the installer for your platform below.

            - **Windows** - `.exe` (NSIS) or `.msi`
            - **Linux** - `.deb` (Debian/Ubuntu), `.rpm` (Fedora/RHEL), `.AppImage` (portable; also runs on Arch)

            Astra is local-first: you supply your own API key in Settings after installing.
          releaseDraft: false
          prerelease: true
