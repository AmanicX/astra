name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Web (typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  rust:
    name: Rust (Fedora - check, test)
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y @development-tools git nodejs npm curl tar gzip file findutils \
            clang glibc-devel \
            webkit2gtk4.1-devel gtk3-devel libappindicator-gtk3-devel \
            librsvg2-devel patchelf \
            pipewire-devel dbus-devel libxcb-devel libXrandr-devel mesa-libgbm-devel \
            openssl-devel

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm run build

      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: cargo test --manifest-path src-tauri/Cargo.toml
